services:
  neo4j:
    # Pinned to the version graphiti-core's own reference docker-compose.yml
    # uses (graphiti-reference/docker-compose.yml), which is a version known
    # to work with the graphiti-core release MiroFish depends on.
    image: neo4j:5.26.2
    container_name: mirofish-neo4j
    ports:
      - "7474:7474" # Neo4j Browser (HTTP)
      - "7687:7687" # Bolt (used by the backend)
    environment:
      # Must match NEO4J_USER / NEO4J_PASSWORD in the project root .env
      # (see .env.example). Defaults here match backend/app/config.py's
      # local-dev defaults.
      - NEO4J_AUTH=${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-mirofish-local-dev}
      - NEO4J_server_memory_heap_initial__size=512m
      - NEO4J_server_memory_heap_max__size=1G
      - NEO4J_server_memory_pagecache_size=512m
    volumes:
      - mirofish_neo4j_data:/data
      - mirofish_neo4j_logs:/logs
    healthcheck:
      test: ["CMD", "wget", "-O", "/dev/null", "http://localhost:7474"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 5s
    restart: unless-stopped

volumes:
  mirofish_neo4j_data:
  mirofish_neo4j_logs:
