[project]
name = "mirofish-backend"
version = "0.1.0"
description = "MiroFish - 简洁通用的群体智能引擎，预测万物"
requires-python = ">=3.11,<3.13"
license = { text = "AGPL-3.0" }
authors = [
    { name = "MiroFish Team" }
]

dependencies = [
    # 核心框架
    "flask>=3.0.0",
    "flask-cors>=6.0.0",
    
    # LLM 相关
    "openai>=1.0.0",
    
    # Graphiti（自托管图谱记忆引擎，替代 Zep Cloud，基于本地 Neo4j）
    # neo4j 驱动是 graphiti-core 的基础依赖，无需额外 extra。
    # sentence-transformers 用于本地 embedding（供 MiroFish 自己的
    # SentenceTransformersEmbedder 使用）；不额外加版本下限，camel-oasis 已经把它
    # 固定在 3.0.0，这个版本的 SentenceTransformer.encode() API 已经够用。
    "graphiti-core>=0.30.2",
    "sentence-transformers",
    "httpx>=0.27.0",
    
    # OASIS 社交媒体模拟
    "camel-oasis==0.2.5",
    "camel-ai==0.2.78",
    
    # 文件处理
    "PyMuPDF>=1.24.0",
    # 编码检测（支持非UTF-8编码的文本文件）
    "charset-normalizer>=3.0.0",
    "chardet>=5.0.0",

    # 工具库
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    # 进程管理（之前只是 camel-oasis/graphiti-core 的间接依赖，未显式声明；
    # 现在被本项目代码直接引用，显式固定版本下限）
    "psutil>=5.9.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pipreqs>=0.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
# camel-oasis==0.2.5 pins neo4j==5.23.0 exactly; graphiti-core requires
# neo4j>=5.26.0. camel-oasis's own use of neo4j is unrelated to Graphiti (it
# does not touch our Neo4j graph memory store at all), and the neo4j Python
# driver's Bolt protocol is backward compatible across these minor
# versions, so forcing the newer driver here is safe.
override-dependencies = ["neo4j>=5.26.0"]
